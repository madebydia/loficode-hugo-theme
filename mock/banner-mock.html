<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LofiCode - CTA mock</title>
<link rel="stylesheet" href="https://madebydia.com/loficode-hugo-theme/css/style.css">
<style>
.theme-cta-banner {
  background: repeating-linear-gradient(45deg, #1a1a2e, #1a1a2e 12px, #16213e 12px, #16213e 24px);
  color: #e0e0e0; padding: 14px 20px; display: flex; align-items: center; justify-content: center;
  gap: 16px; flex-wrap: wrap; font-size: 14px; border-bottom: 2px solid #ff6ec7;
}
.theme-cta-banner .cta-text strong { color: #ff6ec7; }
.theme-cta-banner a.cta-btn {
  background: #ff6ec7; color: #1a1a2e; padding: 6px 14px; border-radius: 6px;
  text-decoration: none; font-weight: 700; font-size: 13px; white-space: nowrap;
}
.theme-cta-banner a.cta-btn.ghost { background: transparent; color: #e0e0e0; border: 1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="theme-cta-banner">
  <span class="cta-text"><strong>LofiCode</strong> is a free Hugo theme - you're looking at the live demo</span>
  <a class="cta-btn" href="https://github.com/madebydia/loficode-hugo-theme">★ GitHub</a>
  <a class="cta-btn ghost" href="https://themes.gohugo.io/themes/loficode-hugo-theme/">Install</a>
</div>
<header class="site-header"><nav><div class="nav-left"><a href="#" class="logo">LofiCode Hugo Theme</a></div></nav></header>
<main><div class="container" style="padding:40px 20px"><h1>Welcome to LofiCode Theme</h1><p>A cozy Hugo theme for developers and creatives. (demo content below, shortened for the mock)</p></div></main>
</body>
</html>
